{% extends 'Estructura/base.html' %}

{% block content %}

{% load static %}

<section class="contenedor_formulario">
    <div class="contenedor_campos_amplio">
        <h2>Cuentas Bancarias</h2>

        <div class="modulo_buqueda">
            <h3>Búsqueda</h3>

            <form method="post" class="formulario_base">
                {% csrf_token %}

                <div class="campos_fila">
                    <div class="campos_reducido">
                        <div class="campo_formulario">
                            <label for="metodos">Método de Pago:</label>
                            <select name="metodos" id="metodos"></select>
                        </div>
                    </div>
                </div>
            </form>
        </div>

        <div class="modulo_visualizar">
            <div class="contenedor_tabla">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>MÉTODO DE PAGO</th>
                            <th>BANCO</th>
                            <th>ESTADO</th>
                            <th>ACCIÓN</th>
                        </tr>
                    </thead>
                    <tbody id="contenedor_cuentas"></tbody>
                </table>
            </div>

            <div class="botones_navegacion">
                <button class="btn_secundario btn_retroceder" type="button">Retroceder</button>
                <button class="btn_primario btn_avanzar" type="button">Avanzar</button>
            </div>
        </div>

    </div>
</section>

<dialog id="dialogo_gestionar" class="dialogo">
    <div class="contenedor_datos">
        <button type="button" id="btn_cerrar" class="btn_cerrar">
            <i class="fa-solid fa-square-xmark"></i>
        </button>

        <h2>Actualizar Cuenta Bancaria</h2>

        <div id="contenedor_mensajes_actualizar" class="contenedor_mensajes">
            <i class="fa-solid fa-hourglass-half reloj_procesamiento"></i>
            <p>Actualiza los datos de la cuenta.</p>
        </div>

        <div class="modulo_dialogo_datos">
            <form method="post" id="formulario_actualizar" class="formulario_dialogo_datos">
                {% csrf_token %}
                <input type="hidden" name="id_cuenta" id="id_cuenta">

                <div class="campo_formulario">
                    <label for="bancos">Banco:</label>
                    <select name="bancos" id="bancos"></select>
                </div>

                <div class="campo_formulario">
                    <label for="metodos_pagos">Método de Pago:</label>
                    <select name="metodos_pagos" id="metodos_pagos"></select>
                </div>

                <div class="campo_formulario">
                    <label for="cedula_identidad">Cédula de Identidad:</label>
                    <div class="grupo_doble">
                        <select name="nacionalidad" id="nacionalidad" class="select_prefijo" required>
                            <option value="V">V</option>
                            <option value="E">E</option>
                            <option value="J">J</option>
                        </select>
                        <input type="text" name="cedula_identidad" id="cedula_identidad" autocomplete="off" required>
                    </div>
                </div>

                <div class="campo_formulario">
                    <label for="num_telefono">Telefono:</label>
                    <div class="grupo_doble">
                        <select name="prefijo" id="prefijo" class="select_prefijo" required></select>
                        <input type="text" name="num_telefono" id="num_telefono" minlength="7" maxlength="7"
                            autocomplete="off" required>
                    </div>
                </div>

                <div class="contenedor_transferencia" id="contenedor_transferencia" hidden>
                    <div class="campo_formulario">
                        <label for="numeros_cuenta">Números de Cuenta:</label>
                        <input type="text" name="numeros_cuenta" id="numeros_cuenta" autocomplete="off" minlength="20"
                            maxlength="20" placeholder="20 dígitos.">
                        <small id="contenedor_mensaje_num_cuenta" class="mensaje-feedback"></small>
                    </div>

                    <div class="campo_formulario">
                        <label for="tipo_cuenta">Tipo Cuenta:</label>
                        <select name="tipo_cuenta" id="tipo_cuenta">
                            <option value="CORRIENTE" selected>Corriente</option>
                            <option value="AHORRO">Ahorro</option>
                        </select>
                    </div>
                </div>

                <div class="contenedor_boton_submit">
                    <button type="submit" class="btn_submit">
                        <i class="fa-solid fa-pen-to-square"></i>
                        Actualizar
                    </button>
                </div>
            </form>
        </div>

    </div>
</dialog>

<script src="{% static 'Funcionalidades/cedula_identidad.js' %}"></script>
<script src="{% static 'Funcionalidades/telefono.js' %}"></script>
<script src="{% static 'Funcionalidades_Asincronas/ventas/cuentas_bancarias/gestionar_cuentas.js' %}"></script>

{% endblock %}
