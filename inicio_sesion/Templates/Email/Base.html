<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hielo Caipe C.A.</title>
</head>

<body style="
    margin: 0;
    padding: 0;
    background-color: #f1f5f9;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color: #1e293b;
    -webkit-text-size-adjust: 100%;
    -ms-text-size-adjust: 100%;
">

    <!-- TABLA CONTENEDORA PRINCIPAL (Garantiza compatibilidad universal en clientes de correo) -->
    <table width="100%" cellpadding="0" cellspacing="0" border="0" style="
        background-color: #f1f5f9;
        margin: 0;
        padding: 30px 0;
        width: 100%;
    ">
        <tr>
            <td align="center">

                <!-- CONTENEDOR CENTRAL DE LA PLANTILLA -->
                <table width="100%" cellpadding="0" cellspacing="0" border="0" style="
                    max-width: 620px;
                    margin: 0 auto;
                    background-color: #ffffff;
                    border-radius: 12px;
                    border: 1px solid #e2e8f0;
                    overflow: hidden;
                    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
                ">

                    <!-- ENCABEZADO / HEADER -->
                    <tr>
                        <td align="center" style="
                            background-color: #0f172a;
                            padding: 24px 20px;
                            border-bottom: 4px solid #0284c7;
                            text-align: center;
                        ">
                            <h1 style="
                                margin: 0;
                                color: #ffffff;
                                font-size: 20px;
                                font-weight: 700;
                                letter-spacing: 0.5px;
                                text-transform: uppercase;
                            ">
                                Hielo Caipe C.A.
                            </h1>
                        </td>
                    </tr>

                    <!-- CUERPO DINÁMICO / BLOQUE DE CONTENIDO -->
                    <tr>
                        <td style="
                            padding: 32px 24px;
                            background-color: #ffffff;
                        ">
                            {% block content %}
                            {% endblock %}
                        </td>
                    </tr>

                    <!-- PIE DE PÁGINA / FOOTER -->
                    <tr>
                        <td align="center" style="
                            background-color: #f8fafc;
                            padding: 20px 24px;
                            border-top: 1px solid #e2e8f0;
                            text-align: center;
                        ">
                            <p style="
                                margin: 0 0 6px;
                                color: #334155;
                                font-size: 12px;
                                font-weight: 700;
                            ">
                                Sistema Administrativo de Hielo Caipe C.A.
                            </p>
                            <p style="
                                margin: 0;
                                color: #94a3b8;
                                font-size: 11px;
                                line-height: 1.5;
                            ">
                                Este mensaje fue generado automáticamente.<br>
                                Por favor, no responda a este correo electrónico.
                            </p>
                        </td>
                    </tr>

                </table>
                <!-- FIN DEL CONTENEDOR CENTRAL -->

            </td>
        </tr>
    </table>

</body>

</html>
