{% extends 'Estructura/Base.html' %}

{% block content %}

{% load static %}

<section class="contenedor_formulario">
    <div class="contenedor_campos">
        <button type="button" id="btn_cerrar" class="btn_cerrar">
            <i class="fa-solid fa-square-xmark" style="color: rgb(225, 225, 225);"></i>
        </button>

        <h2>Completar Datos Empleado</h2>

        <div class="progreso">
            <div class="linea">
                <div class="avance"></div>
                <div class="pasos">
                    <div class="paso_progreso activo">
                        <span>1</span>
                        <small>Datos Básicos</small>
                    </div>
                    <div class="paso_progreso">
                        <span>2</span>
                        <small>Contacto</small>
                    </div>
                    <div class="paso_progreso">
                        <span>3</span>
                        <small>Nacimiento</small>
                    </div>
                    <div class="paso_progreso">
                        <span>4</span>
                        <small>Residencia</small>
                    </div>
                </div>
            </div>
        </div>

        <div class="wrapper_formulario">
            <form method="post" id="formulario_completar_registrar" class="formulario_base">
                {% csrf_token %}

                <article class="paso activo">
                    <div class="bloque_paso">
                        <h3>Datos Básicos</h3>

                        <div class="campo_formulario">
                            <label for="nombre_usuario_visualizar">Nombres:</label>
                            <input type="text" name="nombre_usuario" id="nombre_usuario_visualizar" disabled>
                        </div>

                        <div class="campo_formulario">
                            <label for="apellido_usuario_visualizar">Apellidos:</label>
                            <input type="text" name="apellido_usuario" id="apellido_usuario_visualizar" readonly>
                        </div>

                        <div class="campo_formulario">
                            <label for="cedula_usuario_visualizar">Cedula de Identidad:</label>
                            <input type="text" name="cedula_usuario" id="cedula_usuario_visualizar" readonly>
                        </div>

                        <div class="campo_formulario">
                            <label for="genero_usuario_visualizar">Genero:</label>
                            <input type="text" name="genero_usuario" id="genero_usuario_visualizar" readonly>
                        </div>

                        <div class="campo_formulario">
                            <label for="estado_civil_usuario_visualizar">Estado Civil</label>
                            <input type="text" name="estado_civil_usuario" id="estado_civil_usuario_visualizar"
                                readonly>
                        </div>
                    </div>
                </article>

                <article class="paso">
                    <div class="bloque_paso">
                        <h3>Contacto</h3>

                        <div class="campo_formulario">
                            <label for="num_telefono_principal">Telefono Principal:</label>
                            <div class="grupo_doble">
                                <select name="prefijo_principal" id="prefijo_principal" class="select_prefijo"
                                    required></select>
                                <input type="text" name="numero_principal" id="num_telefono_principal" minlength="7"
                                    maxlength="7" autocomplete="off" required>
                            </div>
                            <small id="contenedor_mensaje_telefono_principal" class="mensaje-feedback"></small>
                        </div>

                        <div class="campo_formulario">
                            <label for="num_telefono_secundario">Telefono Secundaria (Opcional):</label>
                            <div class="grupo_doble">
                                <select name="prefijo_secundaria" id="prefijo_secundario"
                                    class="campo_opcional select_prefijo"></select>
                                <input type="text" name="numero_secundaria" id="num_telefono_secundario" minlength="7"
                                    maxlength="7" autocomplete="off" class="campo_opcional">
                            </div>
                            <small id="contenedor_mensaje_telefono_secundario" class="mensaje-feedback"></small>
                        </div>

                        <div class="campo_formulario">
                            <label for="correo_principal">Correo Electronico Principal:</label>

                            <div class="grupo_doble">
                                <input type="text" name="correo_principal" id="correo_principal" minlength="5"
                                    maxlength="20" placeholder="Correo Electronico Principal (5-20 caracteres máximo)"
                                    autocomplete="off" required>

                                <select name="dominio_principal" id="dominio_principal" class="select_dominio"
                                    required></select>
                            </div>
                            <small id="contenedor_mensaje_correo_principal" class="mensaje-feedback"></small>
                        </div>

                        <div class="campo_formulario">
                            <label for="correo_secundario">Correo Electronico Secundaria (Opcional):</label>

                            <div class="grupo_doble">
                                <input type="text" name="correo_secundaria" id="correo_secundario" minlength="5"
                                    maxlength="20" placeholder="Correo Electronico Secundario (5-20 caracteres máximo)"
                                    autocomplete="off" class="campo_opcional" required>

                                <select name="dominio_secundaria" id="dominio_secundaria"
                                    class="campo_opcional select_dominio" required></select>
                            </div>

                            <small id="contenedor_mensaje_correo_secundario" class="mensaje-feedback"></small>
                        </div>
                    </div>
                </article>

                <article class="paso">
                    <div class="bloque_paso">
                        <h3>Nacimiento</h3>
                        <div class="campo_nacimiento">
                            <label for="pais_nacimiento">País:</label>
                            <select name="pais_nacimiento" id="pais_nacimiento" required></select>
                        </div>

                        <div class="campo_nacimiento">
                            <label for="estado_nacimiento">Estado:</label>
                            <select name="estado_nacimiento" id="estado_nacimiento"></select>

                            <input type="text" name="estado_nacimiento_nvzla" id="estado_novzla"
                                placeholder="Ingrese el estado (máximo 50 caracteres)" maxlength="50" autocomplete="off"
                                hidden>
                        </div>

                        <div class="campo_nacimiento">
                            <label for="municipio_nacimiento">Municipio:</label>
                            <select name="municipio_nacimiento" id="municipio_nacimiento">
                                <option value="">Seleccione el Municipio</option>
                            </select>

                            <input type="text" name="municipio_nacimiento_nvzla" id="municipio_novzla"
                                placeholder="Ingrese el municipio (máximo 50 caracteres)" maxlength="50"
                                autocomplete="off" hidden>
                        </div>

                        <div class="campo_nacimiento">
                            <label for="parroquia_nacimiento">Parroquia:</label>
                            <select name="parroquia_nacimiento" id="parroquia_nacimiento">
                                <option value="">Seleccione el Parroquia</option>
                            </select>

                            <input type="text" name="parroquia_nacimiento_nvzla" id="parroquia_novzla"
                                placeholder="Ingrese el parroquia (máximo 50 caracteres)" maxlength="50"
                                autocomplete="off" hidden>
                        </div>

                        <div class="campo_nacimiento">
                            <label for="direccion_nacimiento">Dirección:</label>
                            <textarea name="direccion_nacimiento" id="direccion_nacimiento" maxlength="250"
                                placeholder="Ingrese su dirección de nacimiento cuenta con (250 caracteres máximo)."
                                required></textarea>

                            <div class="contador_caracteres">
                                <span id="contador_nacimiento">0</span> / 250 caracteres
                            </div>
                        </div>

                        <div class="campo_nacimiento">
                            <label for="fecha_nacimiento_usuario">Fecha de Nacimiento:</label>
                            <input type="date" name="fecha_nacimiento" id="fecha_nacimiento_usuario" required>
                        </div>
                    </div>
                </article>

                <article class="paso">
                    <div class="bloque_paso">
                        <h3>Residencia</h3>

                        <div class="campo_formulario">
                            <label for="condicion_residencia_usuario">Condición de Residencia:</label>
                            <select name="condicion_residencia" id="condicion_residencia_usuario" required>
                                <option value="">Selecciona la condición de residencia</option>
                                <option value="Propietario">Propietario</option>
                                <option value="Alquilado">Alquilado</option>
                                <option value="Familiar">Familiar</option>
                                <option value="Prestado">Prestado</option>
                                <option value="Compartido">Compartido</option>
                            </select>
                        </div>

                        <div class="campo_formulario">
                            <label for="municipio_residencia">Municipio:</label>
                            <select name="municipio_residencia" id="municipio_residencia" required></select>
                        </div>

                        <div class="campo_formulario">
                            <label for="parroquia_residencia">Parroquia:</label>
                            <select name="parroquia_residencia" id="parroquia_residencia" required></select>
                        </div>

                        <div class="campo_formulario">
                            <label for="direccion_domicilio">Dirección:</label>
                            <textarea name="direccion_residencia" id="direccion_domicilio" maxlength="250"
                                placeholder="Ingrese su dirección de residencia cuenta con (250 caracteres máximo)."
                                required></textarea>

                            <div class="contador_caracteres">
                                <span id="contador_residencia">0</span> / 250 caracteres
                            </div>
                        </div>

                        <div class="contenedor_boton_submit">
                            <button type="submit" class="btn_primario btn_registro">Guardar Datos</button>
                        </div>
                    </div>
                </article>
            </form>
        </div>

        <div class="botones_navegacion">
            <button class="btn_secundario btn_retroceder" type="button">Retroceder</button>
            <button class="btn_primario btn_avanzar" type="button">Avanzar</button>
        </div>
    </div>
</section>

<script src="{% static 'Funcionalidades/fecha_nacimiento.js' %}"></script>
<script src="{% static 'Funcionalidades/correo_electronico.js' %}"></script>
<script src="{% static 'Funcionalidades/telefono.js' %}"></script>
<script src="{% static 'Funcionalidades/residencia.js' %}"></script>
<script src="{% static 'Funcionalidades/nacimiento.js' %}"></script>
<script src="{% static 'Funcionalidades/desplazamiento_controles.js' %}"></script>
<script src="{% static 'Funcionalidades_Asincronas/empleados/administrador/completar_registrar.js' %}"></script>

{% endblock %}
