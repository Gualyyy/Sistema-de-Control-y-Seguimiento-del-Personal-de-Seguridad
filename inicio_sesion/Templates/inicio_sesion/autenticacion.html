{% extends 'Estructura/Base.html' %}

{% block content %}

{% load static %}

<section class="contenedor_inicio_sesion">
    <div class="login_imagen">
        <img src="{% static 'Imagenes/inicio_sesion.png' %}" alt="Imagen de inicio de sesión">
        <div class="capa_overlay">
            <div class="mensaje_bienvenida">
                <h2>Bienvenido</h2>
                <p>Sistema integral para la administración, distribución y comercialización de hielo.</p>
            </div>
        </div>
    </div>

    <div class="formulario_login_seccion">
        <div class="login_contenido">
            <div class="titulo_login">
                <h2>Inicio de Sesión</h2>
            </div>

            <form method="post" id="formulario_autenticacion">
                {% csrf_token %}
                <div class="campo_login">
                    <label for="id_usuario">Usuario</label>
                    <input name="nombre_usuario" id="id_usuario" type="text"
                        placeholder="Ingrese su usuario (30 caracteres)" autocomplete="off" maxlength="30" required>
                </div>

                <div class="campo_login">
                    <label for="clave">Contraseña</label>
                    <div class="password_contenedor">
                        <input name="contrasenia" id="clave" type="password"
                            placeholder="Ingrese su contraseña  (30 caracteres)" autocomplete="off" maxlength="30"
                            required>
                        <input type="checkbox" class="checkbox_ojo">
                        <label class="icono_ojo" aria-label="Mostrar u ocultar contraseña">
                            <i class="fa-sharp-duotone fa-regular fa-eye icono_mostrar"></i>
                            <i class="fa-duotone fa-regular fa-eye-slash icono_ocultar"></i>
                        </label>
                    </div>
                </div>

                <div class="contenedor_boton_submit">
                    <button type="submit" class="boton_login" id="btn_registrar">
                        <i class="fa-solid fa-user-lock"></i>
                        Autenticación
                    </button>
                </div>
            </form>
        </div>

        <nav class="enlaces_login" aria-label="Opciones de acceso">
            <a href="{% url 'menu_acceso' %}">
                <i class="fa-solid fa-user-plus" aria-hidden="true"></i>
                <span>Registro y Acceso</span>
            </a>

            <a href="{% url 'buscar_usuario' %}">
                <i class="fa-solid fa-key" aria-hidden="true"></i>
                <span>Recuperar Credenciales</span>
            </a>
        </nav>

    </div>
</section>

<script src="{% static 'Funcionalidades/contrasenia.js' %}?v=20261109"></script>
<script src="{% static 'Funcionalidades_Asincronas/inicio_sesion/autenticacion.js' %}?v=20261109-2"></script>

{% endblock %}
