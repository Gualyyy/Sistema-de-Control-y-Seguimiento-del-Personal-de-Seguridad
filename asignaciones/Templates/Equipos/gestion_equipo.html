{% extends 'Estructura/base.html' %}

{% block content %}

{% load static %}

<section class="contenedor_formulario">
    <div class="contenedor_campos_extra_amplio">
        <h2>Actualizar Datos del Equipo</h2>

        <div class="gestion_equipos">

            <div class="actualizar">
                <h3>Actualizar Datos</h3>

                <form method="post" id="formulario_actualizar" class="formulario_equipo">
                    {% csrf_token %}

                    <input type="hidden" name="equipo_id" id="id_equipo">

                    <div class="campo_formulario">
                        <label for="nombre_equipo_actualizar">Nombre:</label>
                        <input type="text" name="nombre" id="nombre_equipo_actualizar"
                            minlength="5" maxlength="35"
                            placeholder="Ingresa el nombre del equipo (5 - 35 caracteres)."
                            autocomplete="off" required>
                    </div>

                    <div class="campo_formulario">
                        <label for="cantidad_disponible_actualizar">Cantidad Total del Equipo:</label>
                        <input type="text" name="cantidad_disponible" id="cantidad_disponible_actualizar"
                            inputmode="numeric" maxlength="3" pattern="[1-9][0-9]{0,2}"
                            placeholder="Ingrese la cantidad total del equipo."
                            autocomplete="off" required>
                        <small id="contenedor_msg_cantidad_actualizar" class="mensaje-feedback"></small>
                    </div>

                    <div class="campo_formulario">
                        <label for="categoria_equipo_actualizar">Categoría de Equipo:</label>
                        <select name="categoria_equipo" id="categoria_equipo_actualizar" required></select>
                    </div>

                    <div class="campo_formulario">
                        <label for="observacion_equipo_actualizar">Observación del Equipo (Opcional):</label>
                        <textarea name="observacion" id="observacion_equipo_actualizar"
                            maxlength="200"
                            placeholder="Cuenta con 200 caracteres máximo para especificar la observación."></textarea>

                        <div class="contador_caracteres">
                            <span id="contador_observacion_actualizar">0</span> / 200 caracteres
                        </div>
                    </div>

                    <div class="contenedor_boton_submit">
                        <button type="submit" class="btn_primario" id="btn_actualizar">
                            <i class="fa-solid fa-pen-to-square" aria-hidden="true"></i>
                            Actualizar Datos
                        </button>
                    </div>
                </form>
            </div>

            <div class="visualizar_equipos">
                <h3>Visualizar Datos</h3>

                <div class="filtro_busqueda_equipos">
                    <form method="post" id="formulario_busqueda_equipos" class="formulario_base">
                        {% csrf_token %}

                        <div class="campos_fila">
                            <div class="campo_formulario">
                                <label for="codigo_equipo">Código Equipo:</label>
                                <input type="text" name="codigo" id="codigo_equipo"
                                    maxlength="7"
                                    placeholder="Código de Equipo (7 caracteres)."
                                    autocomplete="off">
                            </div>

                            <div class="campo_formulario">
                                <label for="categorias_registradas">Categoría de Equipo:</label>
                                <select name="categoria" id="categorias_registradas"></select>
                            </div>
                        </div>
                    </form>
                </div>

                <div class="contenedor_tabla detalle">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>NOMBRE DEL EQUIPO</th>
                                <th>CÓDIGO</th>
                                <th>ACCIONES</th>
                            </tr>
                        </thead>

                        <tbody id="contenedor_equipos" class="filas_equipos">
                        </tbody>
                    </table>
                </div>

                <div class="botones_navegacion">
                    <button class="btn_secundario btn_ret btn_retroceder" type="button">
                        <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
                        Retroceder
                    </button>

                    <button class="btn_primario btn_av btn_avanzar" type="button">
                        Avanzar
                        <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
                    </button>
                </div>

            </div>

        </div>

    </div>
</section>

<dialog id="dialogo_equipo" class="dialogo">
    <div class="contenedor_datos">
        <button type="button" id="btn_cerrar" class="btn_cerrar">
            <i class="fa-solid fa-square-xmark"></i>
        </button>

        <h2>Datos del Equipo</h2>

        <div class="modulo_dialogo_datos">
            <form method="post" class="formulario_dialogo_datos">
                {% csrf_token %}
                <input type="hidden" name="id_equipo" id="id_equipo_detalle">

                <div class="campo_formulario">
                    <label for="nombre_equipo_visualizar">Nombre del Equipo:</label>
                    <input type="text" id="nombre_equipo_visualizar" readonly>
                </div>

                <div class="campo_formulario">
                    <label for="codigo_equipo_visualizar">Código:</label>
                    <input type="text" id="codigo_equipo_visualizar" readonly>
                </div>

                <div class="campo_formulario">
                    <label for="cantidad_disponible_equipo_visualizar">Cantidad Disponible:</label>
                    <input type="text" id="cantidad_disponible_equipo_visualizar" readonly>
                </div>

                <div class="campo_formulario">
                    <label for="categoria_equipo_visualizar">Categoría del Equipo:</label>
                    <input type="text" id="categoria_equipo_visualizar" readonly>
                </div>

                <div class="campo_formulario">
                    <label for="fecha_registro_visualizar">Fecha Registro:</label>
                    <input type="text" id="fecha_registro_visualizar" readonly>
                </div>

                <div class="campo_formulario">
                    <label for="observacion_equipo_visualizar">Observación:</label>
                    <textarea id="observacion_equipo_visualizar" readonly></textarea>
                </div>
            </form>
        </div>

    </div>
</dialog>

<script src="{% static 'Funcionalidades_Asincronas/equipos/gestionar_equipo.js' %}?v=20261112-equipment-controls-5"></script>
{% endblock %}
