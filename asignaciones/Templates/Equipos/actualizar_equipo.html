{% extends 'Estructura/base.html' %}

{% block content %}

{% load static %}

<section class="contenedor_formulario">
    <div class="contenedor_campos_amplio">
        <h2>Actualizar Datos del Equipo</h2>

        <div class="modulo_buqueda">
            <h3>Buscar Equipo</h3>

            <form method="post" id="formulario_busqueda" class="formulario_base">
                {% csrf_token %}

                <div class="campo_reducido">
                    <label for="codigo_equipo">Código del Equipo:</label>
                    <input type="text" name="codigo_equipo" id="codigo_equipo" placeholder="Ingrese el código."
                        autocomplete="off" required>
                </div>

                <div class="contenedor_boton_submit">
                    <button type="submit" class="btn_primario">Buscar</button>
                </div>
            </form>
        </div>

        <div class="modulo_equipo">
            <form method="post" id="formulario_actualizar" class="formulario_equipo">
                {% csrf_token %}
                <input type="hidden" name="equipo_id" id="id_equipo">

                <div class="campo_formulario">
                    <label for="nombre_equipo">Nombre:</label>
                    <input type="text" name="nombre" id="nombre_equipo" minlength="5" maxlength="35"
                        placeholder="Ingresa el nombre del equipo (5 - 35 caracteres)." autocomplete="off">
                </div>

                <div class="campo_formulario">
                    <label for="cantidad_disponible">Cantidad Disponible del Equipo:</label>
                    <input type="text" name="cantidad_disponible" id="cantidad_disponible" min="0" max="999" step="1"
                        placeholder="Ingrese la cantidad total de equipos." autocomplete="off">
                    <small id="contenedor_msg_cantidad" class="mensaje-feedback"></small>
                </div>

                <div class="campo_formulario">
                    <label for="categoria_equipo">Categoría de Equipo:</label>
                    <select name="categoria_equipo" id="categoria_equipo"></select>
                </div>

                <div class="campo_formulario">
                    <label for="observacion_equipo">Observación del Equipo (Opcional):</label>
                    <textarea name="observacion" id="observacion_equipo" maxlength="200"
                        placeholder="Cuenta con 200 caracteres máximo para especificar la observación."></textarea>
                    <div class="contador_caracteres">
                        <span id="contador_observacion">0</span> / 200 caracteres
                    </div>
                </div>

                <div class="contenedor_boton_submit">
                    <button type="submit" class="btn_primario" id="btn_actualizar">Actualizar Datos</button>
                </div>
            </form>
        </div>
    </div>
</section>

<script src="{% static 'Funcionalidades_Asincronas/equipos/actualizar_equipos.js' %}"></script>

{% endblock %}
