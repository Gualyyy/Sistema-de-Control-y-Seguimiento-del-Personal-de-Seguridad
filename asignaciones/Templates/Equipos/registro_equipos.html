{% extends 'Estructura/base.html' %}

{% block content %}

{% load static %}

<section class="contenedor_formulario">
    <div class="contenedor_campos_amplio">
        <h2>Registrar Equipo</h2>

        <div class="modulo_equipo">
            <form method="post" id="formulario_registrar" class="formulario_equipo">
                {% csrf_token %}

                <div class="campo_formulario">
                    <label for="nombre_equipo">Nombre:</label>
                    <input type="text" name="nombre" id="nombre_equipo" minlength="5" maxlength="35"
                        placeholder="Ingresa el nombre del equipo (5 - 35 caracteres)" autocomplete="off">
                </div>
                <div class="campo_formulario">
                    <label for="codigo_equipo">Código:</label>
                    <input type="text" name="codigo" id="codigo_equipo" autocomplete="off" readonly>
                </div>

                <div class="campo_formulario">
                    <label for="cantidad_total">Cantidad Total:</label>
                    <input type="text" name="cantidad_total" id="cantidad_total" maxlength="3" min="0" step="1"
                        placeholder="Ingrese el número de equipo que cuenta la empresa de Hielo Caipe."
                        autocomplete="off">
                </div>
                <div class="campo_formulario">
                    <label for="categoria_equipo">Categoria de Equipo:</label>
                    <select name="categoria_equipo" id="categoria_equipo"></select>
                </div>

                <div class="campo_formulario">
                    <label for="observacion_equipo">Observación del Equipo (Opcional):</label>
                    <textarea name="observacion" id="observacion_equipo" maxlength="200"
                        placeholder="Cuenta con 200 caracteres máximo para especificar la observación."></textarea>
                    <div class="contador_caracteres">
                        <span id="contador_observacion">0</span> / 200 caracteres
                    </div>
                </div>

                <div class="contenedor_boton_submit">
                    <button type="submit" class="btn_primario">Registrar</button>
                </div>
            </form>
        </div>

    </div>
</section>

<script src="{% static 'Funcionalidades_Asincronas/equipos/registrar_equipo.js' %}"></script>

{% endblock %}
