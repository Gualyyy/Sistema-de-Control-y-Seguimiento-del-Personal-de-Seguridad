{% extends 'Estructura/base.html' %}

{% block content %}

{% load static %}

<section class="contenedor_formulario">
    <div class="contenedor_campos_amplio">
        <h2>Visualizar Equipos</h2>

        <div class="modulo_buqueda">
            <h3>Búsqueda Equipo(s)</h3>

            <form method="post" class="formulario_base">
                {% csrf_token %}
                <div class="campos_fila">
                    <div class="campo_formulario">
                        <label for="codigo_equipo">Código Equipo:</label>
                        <input type="text" name="codigo" id="codigo_equipo" minlength="7" maxlength="7"
                            placeholder="Código de Equipo (7 caracteres)." autocomplete="off">
                    </div>

                    <div class="campo_formulario">
                        <label for="categorias_registradas">Categoría de Equipo:</label>
                        <select name="categoria" id="categorias_registradas"></select>
                    </div>
                </div>
            </form>
        </div>

        <div class="modulo_visualizar detalle">
            <div class="encabezado_registrados">
                <button type="button" class="btn_pdf" id="lista_equipos_pdf">
                    <i class="fa-regular fa-file-pdf"></i>
                    Reporte
                </button>
            </div>

            <div class="contenedor_tabla">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>NOMBRE DEL EQUIPO</th>
                            <th>CÓDIGO</th>
                            <th>CANTIDAD DISPONIBLE</th>
                            <th>FECHA REGISTRADO</th>
                        </tr>
                    </thead>
                    <tbody id="contenedor_equipos"></tbody>
                </table>
            </div>

            <div class="botones_navegacion">
                <button class="btn_secundario btn_retroceder" type="button">Retroceder</button>
                <button class="btn_primario btn_avanzar" type="button">Avanzar</button>
            </div>
        </div>

    </div>
</section>

<dialog id="dialogo_equipo" class="dialogo">
    <div class="contenedor_info_reducido">
        <button type="button" id="btn_cerrar" class="btn_cerrar">
            <i class="fa-solid fa-square-xmark"></i>
        </button>

        <h2>Datos del Equipo</h2>

        <div class="contenedor_btn_pdf">
            <button type="button" class="btn_pdf_dialog" id="datos_equipo_pdf">
                <i class="fa-regular fa-file-pdf"></i>
                Reporte
            </button>
        </div>

        <div class="modelo_dialogo_visualizar">
            <form method="post" class="formulario_dialogo_visualizar">
                {% csrf_token %}
                <input type="hidden" name="id_equipo" id="id_equipo">

                <div class="campo_formulario">
                    <label for="nombre_equipo">Nombre del Equipo:</label>
                    <input type="text" id="nombre_equipo" readonly>
                </div>

                <div class="campo_formulario">
                    <label for="codigo_equipo_visualizar">Código:</label>
                    <input type="text" id="codigo_equipo_visualizar" readonly>
                </div>

                <div class="campo_formulario">
                    <label for="cantidad_disponible_equipo">Cantidad Disponible:</label>
                    <input type="text" id="cantidad_disponible_equipo" readonly>
                </div>

                <div class="campo_formulario">
                    <label for="categoria_equipo">Categoría del Equipo:</label>
                    <input type="text" id="categoria_equipo" readonly>
                </div>

                <div class="campo_formulario">
                    <label for="fecha_registro">Fecha Registro:</label>
                    <input type="text" id="fecha_registro" readonly>
                </div>

                <div class="campo_formulario">
                    <label for="observacion_equipo">Observación:</label>
                    <textarea id="observacion_equipo" readonly></textarea>
                </div>
            </form>
        </div>

    </div>
</dialog>

<script src="{% static 'Funcionalidades_Asincronas/equipos/visualizar_equipos.js' %}"></script>

{% endblock %}
