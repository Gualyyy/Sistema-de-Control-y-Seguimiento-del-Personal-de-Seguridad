{% extends 'Estructura/base.html' %}

{% block content %}

{% load static %}

<section class="contenedor_formulario">
    <div class="contenedor_campos_amplio">
        <h2>Visualizar Equipos Recibido</h2>

        <div class="modulo_buqueda">
            <h3>Búsqueda</h3>

            <form method="post" class="formulario_base">
                {% csrf_token %}
                <div class="campo_reducido">
                    <div class="campo_formulario">
                        <label for="categoria_equipos">Categoria Equipo:</label>
                        <select name="categoria_equipos" id="categoria_equipos"></select>
                    </div>
                </div>
            </form>
        </div>

        <div class="modulo_visualizar detalle">
            <div class="encabezado_registrados">
                <button type="button" class="btn_pdf" id="lista_entrega_pdf">
                    <i class="fa-regular fa-file-pdf"></i>
                    Reporte
                </button>
            </div>

            <!-- Envoltorio para manejar el scroll y recortar bordes -->
            <div class="contenedor_tabla">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>EQUIPO</th>
                            <th>CÓDIGO</th>
                            <th>CANTIDAD RECIBIDO</th>
                            <th>CANTIDAD DISPONIBLE</th>
                            <th>FECHA ENTREGA</th>
                        </tr>
                    </thead>
                    <tbody id="contenedor_equipos_recibido"></tbody>
                </table>
            </div>
        </div>

    </div>
</section>

<dialog id="dialogo_recibido" class="dialogo">
    <div class="contenedor_info">
        <button type="button" id="btn_cerrar" class="btn_cerrar">
            <i class="fa-solid fa-square-xmark"></i>
        </button>

        <h2>Datos de la Entraga</h2>

        <div class="contenedor_btn_pdf">
            <button type="button" class="btn_pdf_dialog" id="datos_entrega_pdf">
                <i class="fa-regular fa-file-pdf"></i>
                Reporte
            </button>
        </div>

        <div class="modelo_datos">
            <form method="post" class="formulario_base">
                {% csrf_token %}
                <input type="hidden" name="id_recibido_equipo" id="id_recibido_equipo">

                <div class="campo_formulario">
                    <label for="equipo_entregado">Equipos:</label>
                    <input type="text" id="equipo_entregado" readonly>
                </div>

                <div class="campo_formulario">
                    <label for="categoria_equipo">Categoria Equipo:</label>
                    <input type="text" id="categoria_equipo" readonly>
                </div>

                <div class="campo_formulario">
                    <label for="codigo_equipo">Código Equipo:</label>
                    <input type="text" id="codigo_equipo" readonly>
                </div>

                <div class="campo_formulario">
                    <label for="cantidad_equipo">Cantidad Recibida:</label>
                    <input type="text" id="cantidad_equipo" readonly>
                </div>

                <div class="campo_formulario">
                    <label for="cantidad_disponible">Cantidad Disponible:</label>
                    <input type="text" id="cantidad_disponible" readonly>
                </div>

                <div class="campo_formulario">
                    <label for="fecha_entrega">Fecha Recibida:</label>
                    <input type="text" id="fecha_entrega" readonly>
                </div>

                <div class="campo_formulario">
                    <label for="observacion_entrega">Observación Recibida:</label>
                    <textarea id="observacion_entrega" readonly></textarea>
                </div>
            </form>
        </div>

    </div>
</dialog>

<script
    src="{% static 'Funcionalidades_Asincronas/entrega_equipos/supervisor/visualizar_equipos_entregados.js' %}"></script>

{% endblock %}
