{% extends 'Estructura/base.html' %}

{% block content %}

{% load static %}

<section class="contenedor_formulario">
    <div class="contenedor_campos_extra_amplio">
        <h2>Registro de Asistencia</h2>

        <div class="contenedor_asistencia">
            <div id="reloj_asistencia"></div>

            <div class="contenedor_fecha">
                <p id="fecha_asistencia">
                    <i class="icon-calendar"></i>
                </p>
            </div>
        </div>
        <div class="controles_asistencia">
            <button type="button" class="btn_asistencia btn_entrada">
                Registrar Entrada
            </button>

            <button type="button" class="btn_asistencia btn_salida">
                Registrar Salida
            </button>
        </div>
    </div>
</section>

<script src="{% static 'Funcionalidades_Asincronas/registrar_asistencia.js' %}"></script>

{% endblock %}
