{% extends 'Estructura/base.html' %}

{% block content %}

{% load static %}

<section class="contenedor_formulario">
    <div class="contenedor_campos_amplio">
        <h2>Registrar Incidencia</h2>

        <div class="modulo_incidencia">
            <form method="post" id="formulario_registrar" class="formulario_incidencia">
                {% csrf_token %}

                <div class="campo_formulario">
                    <label for="vigilantes_registrados">Vigilantes Registrados:</label>
                    <select name="vigilantes_registrados" id="vigilantes_registrados"></select>
                </div>

                <div class="campo_formulario">
                    <label for="tipos_incidencias">Tipos de Incidencias:</label>
                    <select name="tipos_incidencias" id="tipos_incidencias"></select>
                </div>

                <div class="campo_formulario">
                    <label for="fecha_hora_incidencia">Fecha y hora:</label>
                    <input type="datetime-local" name="fecha_hora_incidencia" id="fecha_hora_incidencia" required>
                </div>

                <div class="campo_formulario">
                    <label for="titulo_incidencia">Titulo de Incidencias:</label>
                    <input type="text" name="titulo_incidencia" id="titulo_incidencia"
                        placeholder="Ingresa el titulo de la Incidencia (50 caracteres máximo)" minlength="8"
                        maxlength="50" autocomplete="off" required>
                </div>

                <div class="campo_formulario">
                    <label for="descripcion_incidencia">Descripción de la Incidencias:</label>
                    <textarea name="descripcion_incidencia" id="descripcion_incidencia"
                        placeholder="Ingresa la descripción de la incidencia (400 caracteres máximo)" maxlength="400"
                        autocomplete="off" required></textarea>
                    <div class="contador_caracteres">
                        <span id="contador_descripcion_incidencia">0</span> / 400 caracteres
                    </div>
                </div>

                <div class="contenedor_boton_submit">
                    <button type="submit" class="btn_primario btn_registro">Registrar</button>
                </div>
            </form>
        </div>

    </div>
</section>

<script
    src="{% static 'Funcionalidades_Asincronas/incidencias/supervisor/registrar_incidencia_supervisor.js' %}"></script>

{% endblock %}
